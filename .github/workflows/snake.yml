name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # har roz raat 12 baje (UTC) auto-refresh
  workflow_dispatch:       # manually bhi run kar sakte ho (Actions tab se)
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG (dark + light, violet/amber theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: abhinavsinghparihar
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23F5B53F&color_dots=%23150A26,%232A1452,%235B2FBF,%238B5CF6,%23C4B5FD
            dist/github-snake-light.svg?color_snake=%23D97706&color_dots=%23EFE7FF,%23DDD0FB,%23B79BF7,%238B5CF6,%235B21B6

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
