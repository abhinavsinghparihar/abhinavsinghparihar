<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260">
  <rect width="520" height="260" rx="18" fill="#100826"/>
  <rect x="1" y="1" width="518" height="258" rx="17" fill="none" stroke="#8B5CF6" stroke-opacity="0.25"/>
  <text x="24" y="36" font-family="Consolas,Menlo,monospace" font-size="15" fill="#F5B53F">// skills &amp; tools — proficiency</text>

  <g font-family="Consolas,Menlo,monospace" font-size="12.5">
    <!-- Python -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.4s" fill="freeze"/>
      <text x="24" y="76" fill="#EDE7FB">Python</text>
      <rect x="180" y="66" width="250" height="12" rx="6" fill="#241647"/>
      <rect x="180" y="66" height="12" rx="6" width="0" fill="#F5B53F">
        <animate attributeName="width" from="0" to="205" begin="0.4s" dur="1.1s" fill="freeze"/>
      </rect>
      <text x="470" y="76" text-anchor="end" fill="#A79BC8">82%</text>
    </g>
    <!-- C -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.4s" fill="freeze"/>
      <text x="24" y="110" fill="#EDE7FB">C</text>
      <rect x="180" y="100" width="250" height="12" rx="6" fill="#241647"/>
      <rect x="180" y="100" height="12" rx="6" width="0" fill="#A78BFA">
        <animate attributeName="width" from="0" to="188" begin="0.65s" dur="1.1s" fill="freeze"/>
      </rect>
      <text x="470" y="110" text-anchor="end" fill="#A79BC8">75%</text>
    </g>
    <!-- Cloud -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.80s" dur="0.4s" fill="freeze"/>
      <text x="24" y="144" fill="#EDE7FB">AWS &#183; Google Cloud</text>
      <rect x="180" y="134" width="250" height="12" rx="6" fill="#241647"/>
      <rect x="180" y="134" height="12" rx="6" width="0" fill="#8B5CF6">
        <animate attributeName="width" from="0" to="155" begin="0.90s" dur="1.1s" fill="freeze"/>
      </rect>
      <text x="470" y="144" text-anchor="end" fill="#A79BC8">62%</text>
    </g>
    <!-- DevOps -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.4s" fill="freeze"/>
      <text x="24" y="178" fill="#EDE7FB">DevOps &#183; CI/CD</text>
      <rect x="180" y="168" width="250" height="12" rx="6" fill="#241647"/>
      <rect x="180" y="168" height="12" rx="6" width="0" fill="#7C3AED">
        <animate attributeName="width" from="0" to="137" begin="1.15s" dur="1.1s" fill="freeze"/>
      </rect>
      <text x="470" y="178" text-anchor="end" fill="#A79BC8">55%</text>
    </g>
    <!-- GenAI -->
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.30s" dur="0.4s" fill="freeze"/>
      <text x="24" y="212" fill="#EDE7FB">GenAI &#183; Prompting</text>
      <rect x="180" y="202" width="250" height="12" rx="6" fill="#241647"/>
      <rect x="180" y="202" height="12" rx="6" width="0" fill="#FCD34D">
        <animate attributeName="width" from="0" to="198" begin="1.40s" dur="1.1s" fill="freeze"/>
      </rect>
      <text x="470" y="212" text-anchor="end" fill="#A79BC8">79%</text>
    </g>
  </g>
  <text x="496" y="246" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="10.5" fill="#5F5680">* approx &#8212; skills badhte hue update karta rahunga :)</text>
</svg>
